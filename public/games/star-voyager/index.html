<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STAR VOYAGER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#02030a; touch-action:none;
    font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color:#dfe9ff; user-select:none; -webkit-user-select:none; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #hpwrap { position:absolute; top:max(14px, env(safe-area-inset-top)); left:max(16px, env(safe-area-inset-left));
    width:min(220px, 40vw); height:14px; border:1px solid #3a4a6a; border-radius:7px; overflow:hidden; background:rgba(10,16,30,.6); }
  #hpbar { height:100%; width:100%; background:linear-gradient(90deg,#2de0a0,#5ff2ff); transition:width .15s; }
  #stats { position:absolute; top:max(14px, env(safe-area-inset-top)); right:max(16px, env(safe-area-inset-right)); text-align:right; }
  #score { font-size:clamp(20px,4vw,30px); font-weight:800; letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#7fd9ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #dist { font-size:clamp(11px,2vw,14px); color:#8aa4d0; margin-top:2px; }

  #vig { position:fixed; inset:0; pointer-events:none; z-index:6; box-shadow:inset 0 0 120px 40px rgba(255,40,40,0); transition:box-shadow .35s; }
  #vig.hit { box-shadow:inset 0 0 120px 40px rgba(255,40,40,.55); transition:box-shadow .05s; }

  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:rgba(2,3,10,.82); backdrop-filter:blur(6px); text-align:center; padding:24px; }
  .overlay h1 { font-size:clamp(34px,8vw,64px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff,#5ff2ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .overlay p { color:#8aa4d0; line-height:1.7; font-size:clamp(13px,2.5vw,16px); }
  .overlay button { pointer-events:auto; cursor:pointer; font-size:18px; font-weight:700; color:#02030a;
    background:linear-gradient(180deg,#8ff6ff,#3ec9f0); border:none; border-radius:10px; padding:14px 46px; letter-spacing:2px; }
  .overlay button:active { transform:scale(.96); }
  #gameover { display:none; }
  #finalStats { color:#c9d8f5; font-size:clamp(14px,3vw,18px); line-height:1.9; }
  #finalStats b { color:#5ff2ff; }
  #reviveBtn { background:linear-gradient(180deg,#ffd98f,#f0a83e); }
</style>

<!--
  실물 광고 연결: AdSense + H5 Games Ads 승인 후 아래 블록의 주석을 해제하고
  ca-pub-XXXXXXXX 를 실제 게시자 ID로 교체하세요. 승인 전에는 테스트 모드로 동작합니다.
-->
<!--
<script async data-ad-frequency-hint="30s"
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
  crossorigin="anonymous"></script>
<script>
  window.__ADSENSE_CLIENT = "ca-pub-XXXXXXXX";
  window.adsbygoogle = window.adsbygoogle || [];
  window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
</script>
-->
<script src="./afg-integration.js"></script>
</head>
<body>
<div id="hud">
  <div id="hpwrap"><div id="hpbar"></div></div>
  <div id="stats"><div id="score">0</div><div id="dist">0 m</div></div>
</div>
<div id="vig"></div>

<div id="start" class="overlay">
  <h1>STAR VOYAGER</h1>
  <p>마우스 · 터치로 우주선을 조종하세요. 사격은 자동입니다.<br>소행성을 피하거나 부수고, 적 전투기를 격추하며 나아가세요.</p>
  <button id="startBtn">발진</button>
</div>

<div id="gameover" class="overlay">
  <h1>SHIP LOST</h1>
  <div id="finalStats"></div>
  <button id="reviveBtn">📺 광고 보고 이어하기</button>
  <button id="restartBtn">재출격</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
